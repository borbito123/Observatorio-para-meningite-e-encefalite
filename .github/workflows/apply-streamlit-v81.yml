name: Apply Streamlit v81 patch

on:
  push:
    paths:
      - 'scripts/patch_streamlit_v81.py'
      - '.github/workflows/apply-streamlit-v81.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/patch_streamlit_v81.py

      - name: Validate syntax
        run: python -m py_compile streamlit_app.py

      - name: Commit updated app
        run: |
          if git diff --quiet -- streamlit_app.py; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add streamlit_app.py
          git commit -m 'fix: complete SINAN mappings and improve LCR rainclouds'
          git push origin HEAD:main
