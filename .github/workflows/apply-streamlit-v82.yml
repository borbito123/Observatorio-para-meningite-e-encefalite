name: Apply Streamlit v82 patch

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/apply_v82_patch.py
      - .github/workflows/apply-streamlit-v82.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_v82_patch.py
      - name: Compile check
        run: python -m py_compile streamlit_app.py
      - name: Commit update
        run: |
          if git diff --quiet -- streamlit_app.py; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git commit -m "feat: add bacteriological analysis section"
          git push
